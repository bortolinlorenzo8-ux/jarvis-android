name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dipendenze
        run: npm install

      - name: Modello wake word
        run: |
          mkdir -p public
          curl -fsSL -o public/porcupine_params.pv https://raw.githubusercontent.com/Picovoice/porcupine/master/lib/common/porcupine_params.pv

      - name: Build web
        run: npm run build

      - name: Progetto Android
        run: |
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compila APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../jarvis.apk

      - name: Pubblica
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JARVIS build ${{ github.run_number }}
          files: jarvis.apk
